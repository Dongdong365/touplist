name: release
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run build
        run: ./gradlew build

      - name: Select largest jar
        id: jarfile
        run: |
          JAR_FILE=$(ls -S build/libs/*.jar | head -1)
          echo "jar=${JAR_FILE}" >> $GITHUB_OUTPUT

      - name: Attach jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jarfile.outputs.jar }}
          generate_release_notes: true
